name: daily-arxiv

# 毎日 11:30 JST (= 02:30 UTC) に自動実行するワークフロー。
#
# この時刻は arXiv の announce に合わせている。arXiv は投稿を日〜木の 20:00 ET に
# announce し、arXiv API は announce 済みの論文しか返さない。20:00 ET を JST に直すと
#   夏 (EDT, UTC-4): 09:00 JST / 冬 (EST, UTC-5): 10:00 JST
# となる(ET は夏時間があるが UTC には無いため、年に2回1時間ずれる)。
# 11:30 JST なら夏で2.5時間、冬でも1.5時間の余裕があり、その朝の分を当日中に拾える。
# 以前の 7:00 JST は直近の announce から約21時間後で、前日の分を見ていた。
# GitHub Actions の schedule の遅延は「後ろにずれる」方向なので、この設計では安全側に働く。
# GitHub Actions の schedule は数十分遅延することがあります(公式仕様)。
# 手動実行(workflow_dispatch)でテストする場合は、Actionsタブから
# 「Run workflow」ボタンを押してください。DRY_RUN を true にすると
# 通知・Issue作成/close・状態ファイル保存を行わず、ログ出力のみで動作確認できます。

on:
  schedule:
    # GitHub Actions の schedule は遅延・スキップが起こる(公式に保証されていない)。
    # このリポジトリでは 2026-08-26 以降、30分程度だった遅延が 2〜8時間に悪化した。
    # そこで起動の機会を3つ用意し、最初に発火したものが処理する。
    # 2回目以降は seen_ids により新着0件となり、Gemini も呼ばずに数十秒で終わるため、
    # 追加コストはほぼ無い(public リポジトリなので Actions の実行時間も無料)。
    - cron: '30 2 * * *'   # 11:30 JST(本命)。arXiv の announce (20:00 ET) の後になるよう設定
    - cron: '30 4 * * *'   # 13:30 JST(予備1)
    - cron: '30 6 * * *'   # 15:30 JST(予備2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にするとDRY_RUNモード(通知・書き込みなし)で実行します'
        required: false
        default: 'false'

permissions:
  contents: write   # data/ 配下の状態ファイルをcommitするため
  issues: write      # Issueの作成・closeのため

# 遅延した本命の実行と予備の実行が重なると、同じ論文を2回通知してしまう。
# 同時に走るのは常に1つだけにする。待たされた実行は、先の実行が seen_ids を
# 更新し終えてからチェックアウトするため、新着0件になって何もしない。
concurrency:
  group: daily-arxiv
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: Botを実行
        env:
          PYTHONUNBUFFERED: "1"
          # 必須: Gemini APIキー(GitHub Secretsに登録してください)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: モデル名を変更したい場合のみSecretsに登録(未設定ならgemini-3.6-flash)
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Discord通知。設定手順は docs/discord.md を参照してください
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # Issue作成・フィードバック回収用(追加設定不要)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 手動実行時にdry_run=trueが指定された場合のみDRY_RUNモードにする
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py

      - name: 状態ファイルをcommit & push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "arxiv-bot"
          git config user.email "arxiv-bot@users.noreply.github.com"
          git add data/seen_ids.json data/feedback.json data/posted_messages.json
          git diff --quiet --cached || git commit -m "chore: update bot state $(date -u +'%Y-%m-%d')"
          git push
